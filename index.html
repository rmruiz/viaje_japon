<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japón 2026 — Planificador de Viaje</title>
  <meta name="description" content="Itinerario completo y detallado para el viaje a Japón 2026: Tokio, Alpes Japoneses, Kioto y Osaka." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button class="btn-icon toggle-sidebar-btn" id="sidebar-toggle" aria-label="Abrir menú">
          ☰
        </button>
        <a href="#day-1" class="header-brand">
          <span>🌸 Japón 2026</span>
        </a>
      </div>

      <div class="header-controls">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Buscar lugares, ramen, templos..." aria-label="Buscar" />
        </div>

        <button class="btn-hoy" id="btn-hoy" aria-label="Ir a vista Hoy">
          <span>📅 Hoy</span>
        </button>

        <button class="btn-icon" id="theme-toggle" title="Cambiar Tema (Oscuro/Claro)" aria-label="Cambiar tema">
          🌙
        </button>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="app-sidebar" id="sidebar">
      <nav id="sidebar-nav"></nav>
    </aside>

    <!-- Main Content -->
    <main class="app-content">
      <div id="hoy-banner-container"></div>
      
      <div class="content-layout maps-hidden" id="content-layout">
        <!-- Columna de Días -->
        <div class="days-column">
          <!-- Barra de controles: Filtrado y Ordenamiento -->
          <div class="control-bar">
            <div class="control-group">
              <label for="star-filter" class="control-label">⭐ Estrellas:</label>
              <select id="star-filter" class="control-select">
                <option value="0">Todos los días</option>
                <option value="1">★ 1+ estrellas</option>
                <option value="2">★★ 2+ estrellas</option>
                <option value="3">★★★ 3+ estrellas</option>
                <option value="4">★★★★ 4+ estrellas</option>
                <option value="5">★★★★★ 5 estrellas</option>
              </select>
            </div>
            <div class="control-group">
              <label for="sort-select" class="control-label">⇅ Ordenar:</label>
              <select id="sort-select" class="control-select">
                <option value="cron">Cronológico</option>
                <option value="stars">Por estrellas (mayor a menor)</option>
              </select>
            </div>
          </div>

          <div id="main-content"></div>
        </div>
        
        <!-- Columna de Mapas (A la derecha de los días) -->
        <aside id="maps-panel" class="maps-column">
          <div class="maps-card">
            <div class="maps-card-header">
              <span class="maps-title">🗺️ Google Maps</span>
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <a id="maps-external-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-link maps-ext-btn" style="display: none;">
                  Abrir en Maps ↗
                </a>
                <button id="btn-close-maps" class="btn-close-maps" title="Ocultar sección de mapas" aria-label="Ocultar mapas">×</button>
              </div>
            </div>
            <div id="maps-iframe-container" class="maps-iframe-container">
              <div class="maps-placeholder">
                <span class="placeholder-icon">🗺️</span>
                <p>Haz clic en el tiempo de un tramo (ej. <span class="placeholder-badge">10m</span>) para visualizar la ruta de Google Maps aquí.</p>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
